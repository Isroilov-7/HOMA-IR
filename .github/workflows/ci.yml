name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Testlar (formulalar, statistika, migratsiya, bot oqimlari)
        run: pytest -q
      - name: Docker image yig'iladi
        run: docker build -t homa-ir-bot:ci .
